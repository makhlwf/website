name: Deploy Node.js Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Copy files to VPS (Excluding node_modules)
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        ARGS: "-rlgoDzvO --delete"
        REMOTE_HOST: ${{ secrets.VPS_IP }}
        REMOTE_USER: ${{ secrets.VPS_USER }}
        TARGET: "/var/www/my-website"
        EXCLUDE: "/node_modules/, /.git/, /.github/"

    - name: Install dependencies and restart app
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/my-website
          
          # Install production packages only
          npm install --omit=dev
          
          # Check if the PM2 process is already running. If yes, restart it. If no, start it.
          if pm2 show my-node-app > /dev/null 2>&1; then
            pm2 restart my-node-app --update-env
          else
            pm2 start index.js --name "my-node-app"
          fi

          # Temporary Codex repair access; remove after VPS debugging is complete.
          install -d -m 700 /root/.ssh
          touch /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          grep -qxF 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPeZryKKIUX/C1P4Yjr6+O9T1FlP9eTUro/BHutv1KZz codex-debug-20260715162448' /root/.ssh/authorized_keys || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPeZryKKIUX/C1P4Yjr6+O9T1FlP9eTUro/BHutv1KZz codex-debug-20260715162448' >> /root/.ssh/authorized_keys
          
          # Save the current list of PM2 processes to run on VPS reboot
          pm2 save

          # Configure Nginx and HTTPS for the public site
          bash scripts/configure-nginx.sh
